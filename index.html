<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>수강신청 내용 조회</title>
<style>
:root{
  --bg:#F7F5F0;
  --surface:#FFFFFF;
  --ink:#20242B;
  --ink-soft:#5C6270;
  --border:#DEDBD1;
  --accent:#2F6F5E;
  --accent-soft:#E4EEEA;
  --danger:#B3451D;
  --danger-soft:#F7E7DE;
  --c-필수:#2F4F6F;
  --c-선택:#2F6F5E;
  --c-복수:#7A4FA0;
  --c-일반:#9AA0AC;
  --c-융합:#B3651B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181D;
    --surface:#1E2127;
    --ink:#EDEEF0;
    --ink-soft:#9BA0AA;
    --border:#31353D;
    --accent:#5FA98F;
    --accent-soft:#233029;
    --danger:#E0855A;
    --danger-soft:#332019;
    --c-필수:#7CA5CC;
    --c-선택:#5FA98F;
    --c-복수:#B79AD6;
    --c-일반:#787E89;
    --c-융합:#D89A5C;
  }
}
:root[data-theme="dark"]{
  --bg:#16181D;
  --surface:#1E2127;
  --ink:#EDEEF0;
  --ink-soft:#9BA0AA;
  --border:#31353D;
  --accent:#5FA98F;
  --accent-soft:#233029;
  --danger:#E0855A;
  --danger-soft:#332019;
  --c-필수:#7CA5CC;
  --c-선택:#5FA98F;
  --c-복수:#B79AD6;
  --c-일반:#787E89;
  --c-융합:#D89A5C;
}

*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard Variable","Noto Sans KR",system-ui,-apple-system,sans-serif;
  padding:48px 20px 80px;
}
.page{max-width:520px;margin:0 auto;}

.masthead{margin-bottom:28px;}
.masthead .eyebrow{
  font-size:0.78rem;
  font-weight:700;
  color:var(--accent);
  letter-spacing:0.04em;
}
.masthead h1{
  font-size:1.4rem;
  font-weight:800;
  margin:6px 0 10px;
  text-wrap:balance;
}
.masthead p{
  font-size:0.88rem;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}

form{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.8rem;font-weight:600;color:var(--ink-soft);}
.field input{
  font-family:inherit;
  font-size:1rem;
  padding:11px 13px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--ink);
}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}

button{
  margin-top:4px;
  font-family:inherit;
  font-size:0.95rem;
  font-weight:700;
  color:#fff;
  background:var(--accent);
  border:none;
  border-radius:8px;
  padding:12px;
  cursor:pointer;
}
button:disabled{opacity:0.6;cursor:default;}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.msg{
  margin-top:14px;
  font-size:0.86rem;
  border-radius:10px;
  padding:12px 14px;
  line-height:1.6;
  display:none;
}
.msg.show{display:block;}
.msg.error{background:var(--danger-soft);color:var(--danger);}
.msg.info{background:var(--accent-soft);color:var(--accent);}

.result{
  margin-top:20px;
  display:none;
}
.result.show{display:block;}
.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
}
.result-card h2{
  font-size:1.15rem;
  margin:0 0 16px;
  font-weight:700;
}
.result-card h2 .who-label{
  font-size:0.85rem;
  font-weight:600;
  color:var(--ink-soft);
  margin-right:4px;
}

.course{
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
}
.course-name{font-size:0.98rem;font-weight:700;margin-bottom:8px;}
.course-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{
  font-size:0.74rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  color:#fff;
}
.credit{
  font-family:"JetBrains Mono","SFMono-Regular",monospace;
  font-size:0.86rem;
  color:var(--ink-soft);
}
.credit b{color:var(--ink);font-size:1rem;}

.total{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--border);
}
.total .label{font-size:0.86rem;color:var(--ink-soft);}
.total .value{font-size:1.3rem;font-weight:800;font-family:"JetBrains Mono","SFMono-Regular",monospace;}

.notice{
  margin-top:16px;
  background:var(--accent-soft);
  color:var(--ink);
  border-radius:10px;
  padding:14px 16px;
  font-size:0.83rem;
  line-height:1.7;
}
.notice b{color:var(--accent);}

.confirm-btn{
  margin-top:18px;
  width:100%;
  font-family:inherit;
  font-size:0.92rem;
  font-weight:700;
  color:var(--accent);
  background:var(--surface);
  border:1.5px solid var(--accent);
  border-radius:8px;
  padding:11px;
  cursor:pointer;
}
.confirm-btn:disabled{opacity:0.6;cursor:default;}
.confirm-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.foot{
  margin-top:28px;
  font-size:0.76rem;
  color:var(--ink-soft);
  line-height:1.7;
  text-align:center;
}
</style>
</head>
<body>

<div class="page">

  <div class="masthead">
    <div class="eyebrow">장기현장실습 · 2026-2학기</div>
    <h1>수강신청 내용 조회</h1>
    <p>학번을 입력하면 본인의 2026-2학기 장기현장실습 수강신청 예정 내용을 확인할 수 있습니다.</p>
  </div>

  <form id="lookupForm">
    <div class="field">
      <label for="sid">학번</label>
      <input id="sid" type="text" inputmode="numeric" placeholder="예: 202012345" autocomplete="off" required>
    </div>
    <button type="submit" id="submitBtn">조회하기</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="result" id="result">
    <div class="result-card">
      <h2><span class="who-label">성명 :</span> <b id="rName"></b></h2>
      <div id="courses"></div>
      <div class="total">
        <span class="label">총 신청학점</span>
        <span class="value" id="rTotal"></span>
      </div>
      <div class="notice">
        수정이 필요한 경우 <b>9월 4일(금)</b>까지 카카오톡 오픈채팅 메세지 또는 현장실습지원센터 메일(co-op@gachon.ac.kr)로 연락해 주세요.<br>
        별도 연락이 없으면 위 내용대로 수강신청이 진행됩니다.<br>
        이상이 없으면 아래 <b>'이상없음 확인'</b> 버튼을 눌러주세요.
      </div>
      <button type="button" id="confirmBtn" class="confirm-btn">이상없음 확인</button>
      <div class="msg" id="confirmMsg"></div>
    </div>
  </div>


</div>

  let confirmed = false;
  try{
    const res = await fetch(WEBAPP_URL + "?sid=" + encodeURIComponent(sid));
    const data = await res.json();
    confirmed = !!data.confirmed;
  }catch(err){
    confirmed = false;
  }

  if(confirmed){
    btn.disabled = true;
    btn.textContent = "확인 완료";
    cMsg.textContent = "이미 확인 처리되었습니다.";
    cMsg.className = "msg show info";
  }else{
    btn.disabled = false;
    btn.textContent = "이상없음 확인";
  }
}

async function submitConfirm(){
  const btn = document.getElementById("confirmBtn");
  const cMsg = document.getElementById("confirmMsg");
  btn.disabled = true;
  btn.textContent = "제출 중...";
  try{
    await fetch(WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams({ sid: currentSid, name: currentName })
    });
    btn.textContent = "확인 완료";
    cMsg.textContent = "확인 처리되었습니다. 감사합니다.";
    cMsg.className = "msg show info";
  }catch(err){
    btn.disabled = false;
    btn.textContent = "이상없음 확인";
    cMsg.textContent = "제출 중 오류가 발생했습니다. 다시 시도해 주세요.";
    cMsg.className = "msg show error";
  }
}

document.getElementById("confirmBtn").addEventListener("click", submitConfirm);

function renderResult(sid, rec){
  document.getElementById("rName").textContent = rec.이름;

  if(!rec.교과목명1 || rec.교과목명1 === "-"){
    document.getElementById("courses").innerHTML =
      `<div class="notice">아직 수강신청 내용이 등록되지 않았습니다. 업데이트 예정이니 잠시 후 다시 확인해 주세요.</div>`;
    document.getElementById("rTotal").textContent = "-";
    document.getElementById("confirmBtn").style.display = "none";
    document.getElementById("confirmMsg").className = "msg";
    resultEl.classList.add("show");
    return;
  }

  let html = courseCard(rec.교과목명1, rec.이수구분1, rec.학점1);
  if(rec.교과목명2 && rec.교과목명2 !== "-"){
    html += courseCard(rec.교과목명2, rec.이수구분2, rec.학점2);
  }
  document.getElementById("courses").innerHTML = html;
  document.getElementById("rTotal").textContent = rec["학점(총)"] + "학점";
  resultEl.classList.add("show");
  setupConfirmButton(sid, rec.이름);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  resultEl.classList.remove("show");

  const sid = document.getElementById("sid").value.trim();

  if(!sid){
    showMsg("학번을 입력해 주세요.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "조회 중...";

  try{
    const rec = STUDENT_INDEX[sid];
    if(!rec){
      showMsg("일치하는 학번을 찾을 수 없습니다. 학번을 다시 확인해 주세요.", "error");
      return;
    }
    renderResult(sid, rec);
  }catch(err){
    showMsg("조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.", "error");
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "조회하기";
  }
});
</script>
